[workspace]
members = [
    "crates/common",
    "crates/db",
    "crates/anchor",
    "crates/api",
    "crates/webhooks",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ChronoCoders <altug@bytus.io>"]
license = "BSL-1.1"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# Web
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "limit"] }

# Database
# `default-features = false` drops sqlx's `any` driver bundle, which would
# otherwise transitively pull in sqlx-mysql (and via that, the vulnerable
# `rsa 0.9.10` crate — RUSTSEC-2023-0071). We explicitly re-enable only the
# features we use: the Postgres driver, the Tokio runtime + rustls TLS, the
# migration system, the macros (for `migrate!`), and the type integrations.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }

# Chain
alloy = { version = "0.3", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha2 = "0.10"
hex = "0.4"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"
