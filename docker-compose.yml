services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genuflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: genuflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genuflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://genuflow:${POSTGRES_PASSWORD}@db:5432/genuflow
      BASE_RPC_URL: ${BASE_RPC_URL}
      ANCHOR_PRIVATE_KEY: ${ANCHOR_PRIVATE_KEY}
      API_PORT: 8080
      RUST_LOG: info
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
